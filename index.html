<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="备考助手" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
  <title>备考助手 · 倒计时与打卡</title>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <h1 id="headerTitle">备考助手</h1>
      <p id="headerSub">今天也要加油呀</p>
    </div>
  </header>

  <main id="view-root">
    <!-- 视图由 JS 动态渲染 -->
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="countdown"><span class="tab-ico">⏳</span><span class="tab-label">倒计时</span></button>
    <button class="tab" data-view="checkin"><span class="tab-ico">✅</span><span class="tab-label">打卡</span></button>
    <button class="tab" data-view="timer"><span class="tab-ico">⏱️</span><span class="tab-label">计时</span></button>
    <button class="tab" data-view="settings"><span class="tab-ico">⚙️</span><span class="tab-label">我的</span></button>
  </nav>

  <div id="toast" class="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
